<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traffic Analysis</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #0a0a1a;
            color: white;
            padding: 20px;
            min-height: 100vh;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 {
            color: #00ff88;
            text-align: center;
            margin-bottom: 25px;
            font-size: 32px;
        }
        .controls {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            background: #1a1a2e;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .controls input {
            flex: 1;
            min-width: 200px;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #0a0a1a;
            color: white;
            font-size: 15px;
        }
        .controls input:focus {
            outline: none;
            border-color: #00ff88;
        }
        .btn {
            padding: 12px 28px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn:hover { transform: translateY(-2px); }
        .btn-start { background: #00ff88; color: #0a0a1a; }
        .btn-start:hover { background: #00cc66; box-shadow: 0 0 30px rgba(0,255,136,0.3); }
        .btn-stop { background: #ff4444; color: white; }
        .btn-stop:hover { background: #cc0000; box-shadow: 0 0 30px rgba(255,68,68,0.3); }
        .btn-clear { background: #ffaa00; color: #0a0a1a; }
        .btn-clear:hover { background: #ff8800; }
        
        .video-container {
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 20px;
            aspect-ratio: 16/9;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255,255,255,0.05);
            position: relative;
        }
        #video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: none;
        }
        .placeholder {
            color: #666;
            font-size: 20px;
            text-align: center;
            padding: 40px;
        }
        .placeholder .icon { font-size: 60px; display: block; margin-bottom: 15px; }
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #00ff88;
            font-size: 18px;
            display: none;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: #1a1a2e;
            padding: 18px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .stat-value {
            font-size: 30px;
            font-weight: bold;
            color: #00ff88;
        }
        .stat-label { color: #888; font-size: 13px; margin-top: 5px; }
        
        .vehicles-section {
            background: #1a1a2e;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .vehicles-section h3 { margin-bottom: 15px; color: rgba(255,255,255,0.8); }
        .vehicles-list {
            max-height: 300px;
            overflow-y: auto;
        }
        .vehicles-list::-webkit-scrollbar {
            width: 6px;
        }
        .vehicles-list::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.05);
            border-radius: 3px;
        }
        .vehicles-list::-webkit-scrollbar-thumb {
            background: rgba(0,255,136,0.3);
            border-radius: 3px;
        }
        .vehicle-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 14px;
            margin: 3px 0;
            background: #0a0a1a;
            border-radius: 6px;
            border-left: 3px solid transparent;
        }
        .plate { color: #00ff88; font-weight: bold; }
        .color-dot {
            display: inline-block;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            margin-right: 10px;
            vertical-align: middle;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .empty-state {
            color: #666;
            text-align: center;
            padding: 30px;
        }
        
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background: #1a1a2e;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .status-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 8px;
        }
        .status-dot.running { background: #00ff88; animation: pulse 1.5s infinite; }
        .status-dot.stopped { background: #ff4444; }
        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
            100% { opacity: 1; transform: scale(1); }
        }
        
        @media (max-width: 768px) {
            .controls { flex-direction: column; }
            .controls input { width: 100%; }
            .btn { width: 100%; justify-content: center; }
            .stats { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚗 Traffic Analysis System</h1>
        
        <div class="status-bar">
            <span>
                <span class="status-dot stopped" id="statusDot"></span>
                <span id="statusText">Stopped</span>
            </span>
            <span id="timeText" style="color: #666; font-size: 14px;"></span>
        </div>
        
        <div class="controls">
            <input type="text" id="rtspInput" placeholder="video.mp4 or rtsp://..." value="video.mp4">
            <button class="btn btn-start" id="startBtn" onclick="startAnalysis()">▶ Start</button>
            <button class="btn btn-stop" id="stopBtn" onclick="stopAnalysis()" disabled>⏹ Stop</button>
            <button class="btn btn-clear" onclick="clearStats()">🗑 Clear</button>
        </div>
        
        <div class="video-container">
            <img id="video" alt="Video stream">
            <div class="placeholder" id="placeholder">
                <span class="icon">📹</span>
                No video stream<br>
                <small style="color: #444;">Click Start to begin analysis</small>
            </div>
            <div class="loading" id="loading">⏳ Loading...</div>
        </div>
        
        <div class="stats">
            <div class="stat-card">
                <div class="stat-value" id="fps">0</div>
                <div class="stat-label">📊 FPS</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="vehicles">0</div>
                <div class="stat-label">🚗 Vehicles</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="plates">0</div>
                <div class="stat-label">📋 Plates</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="frames">0</div>
                <div class="stat-label">📸 Frames</div>
            </div>
        </div>
        
        <div class="vehicles-section">
            <h3>🚘 Active Vehicles</h3>
            <div class="vehicles-list" id="vehiclesList">
                <div class="empty-state">No vehicles detected</div>
            </div>
        </div>
    </div>
    
    <script>
        let intervalId = null;
        let statsIntervalId = null;
        let isRunning = false;
        
        function updateStatus(running) {
            isRunning = running;
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');
            const startBtn = document.getElementById('startBtn');
            const stopBtn = document.getElementById('stopBtn');
            
            if (running) {
                dot.className = 'status-dot running';
                text.textContent = 'Running';
                startBtn.disabled = true;
                stopBtn.disabled = false;
                document.getElementById('placeholder').style.display = 'none';
                document.getElementById('video').style.display = 'block';
            } else {
                dot.className = 'status-dot stopped';
                text.textContent = 'Stopped';
                startBtn.disabled = false;
                stopBtn.disabled = true;
                document.getElementById('video').style.display = 'none';
                document.getElementById('placeholder').style.display = 'block';
            }
        }
        
        function startAnalysis() {
            const rtsp = document.getElementById('rtspInput').value.trim();
            if (!rtsp) {
                alert('Please enter video path or RTSP URL');
                return;
            }
            
            document.getElementById('loading').style.display = 'block';
            
            fetch('/start', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ rtsp_url: rtsp })
            })
            .then(r => r.json())
            .then(data => {
                document.getElementById('loading').style.display = 'none';
                if (data.status === 'success') {
                    updateStatus(true);
                    if (intervalId) clearInterval(intervalId);
                    intervalId = setInterval(updateFrame, 150);
                    if (statsIntervalId) clearInterval(statsIntervalId);
                    statsIntervalId = setInterval(updateStats, 1000);
                } else {
                    alert('Error: ' + data.message);
                }
            })
            .catch(e => {
                document.getElementById('loading').style.display = 'none';
                alert('Error: ' + e.message);
            });
        }
        
        function stopAnalysis() {
            fetch('/stop', { method: 'POST' })
            .then(r => r.json())
            .then(data => {
                if (data.status === 'success') {
                    updateStatus(false);
                    if (intervalId) clearInterval(intervalId);
                    if (statsIntervalId) clearInterval(statsIntervalId);
                }
            });
        }
        
        function updateFrame() {
            fetch('/frame')
            .then(r => r.json())
            .then(data => {
                if (data.status === 'success' && data.frame) {
                    document.getElementById('video').src = 'data:image/jpeg;base64,' + data.frame;
                }
            })
            .catch(e => console.error('Frame error:', e));
        }
        
        function updateStats() {
            fetch('/stats')
            .then(r => r.json())
            .then(data => {
                document.getElementById('fps').textContent = data.current_fps || 0;
                document.getElementById('vehicles').textContent = data.vehicles_detected || 0;
                document.getElementById('plates').textContent = data.plates_detected || 0;
                document.getElementById('frames').textContent = data.total_frames || 0;
                
                const container = document.getElementById('vehiclesList');
                if (data.vehicles && data.vehicles.length > 0) {
                    container.innerHTML = data.vehicles.map(v => {
                        const color = v.color || 'Unknown';
                        const colorHex = getColorHex(color);
                        return `
                            <div class="vehicle-item" style="border-left-color: ${colorHex};">
                                <span>
                                    <span class="color-dot" style="background: ${colorHex};"></span>
                                    ID: ${v.track_id} | ${color}
                                </span>
                                <span class="plate">${v.plate || 'No plate'}</span>
                            </div>
                        `;
                    }).join('');
                } else {
                    container.innerHTML = '<div class="empty-state">No vehicles detected</div>';
                }
                
                // Час
                document.getElementById('timeText').textContent = new Date().toLocaleTimeString();
            })
            .catch(e => console.error('Stats error:', e));
        }
        
        function clearStats() {
            fetch('/clear_stats', { method: 'POST' })
            .then(() => {
                document.getElementById('vehiclesList').innerHTML = '<div class="empty-state">No vehicles detected</div>';
                document.getElementById('plates').textContent = '0';
                document.getElementById('vehicles').textContent = '0';
            });
        }
        
        function getColorHex(name) {
            const colors = {
                'Red': '#ff0000',
                'Blue': '#0066ff',
                'Green': '#00cc44',
                'Yellow': '#ffdd00',
                'White': '#ffffff',
                'Black': '#222222',
                'Gray': '#888888',
                'Orange': '#ff8800',
                'Unknown': '#666666'
            };
            return colors[name] || '#666666';
        }
        
        // Оновлюємо час
        setInterval(() => {
            document.getElementById('timeText').textContent = new Date().toLocaleTimeString();
        }, 1000);
        
        // Enter для запуску
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && document.activeElement === document.getElementById('rtspInput')) {
                startAnalysis();
            }
        });
        
        // Початковий стан
        updateStatus(false);
    </script>
</body>
</html>
